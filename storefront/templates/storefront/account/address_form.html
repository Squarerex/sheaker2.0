{% extends "base.html" %}
{% block content %}
<h1 class="h3">{{ form.instance.pk|yesno:"Edit Address,New Address" }}</h1>
<form method="post" novalidate>
  {% csrf_token %}
  <div class="row g-3">
    {{ form.non_field_errors }}
    {% for field in form %}
      <div class="col-md-6">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        <div class="text-danger small">{{ field.errors }}</div>
      </div>
    {% endfor %}
  </div>
  <div class="mt-3">
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-light" href="{% url 'storefront:addresses_list' %}">Cancel</a>
  </div>
</form>
{% endblock %}
